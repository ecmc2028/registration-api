<form method="POST" action="http://localhost:8787">
    <label for="i-first_name">First Name</label>
    <input id="i-first_name" type="text" name="first_name" required/>
    <br>

    <label for="i-last_name">Last Name</label>
    <input id="i-last_name" type="text" name="last_name" required/>
    <br>

    <label for="i-alias">Alias</label>
    <input id="i-alias" type="text" name="alias"/>
    <br>

    <label for="i-email">Email Address</label>
    <input id="i-email" type="email" name="email" required/>
    <br>

    <label for="i-phone">Phone Number</label>
    <input id="i-phone" type="text" name="phone" pattern="\+[0-9]+" required/>
    <br>

    <label for="i-country">Country</label>
    <input id="i-country" type="country" name="country" required/>
    <br>

    <label for="i-emergency_contact_first_name">Emergency Contact First Name</label>
    <input id="i-emergency_contact_first_name" type="text" name="emergency_contact_first_name" required/>
    <br>

    <label for="i-emergency_contact_last_name">Emergency Contact Last Name</label>
    <input id="i-emergency_contact_last_name" type="text" name="emergency_contact_last_name" required/>
    <br>

    <label for="i-emergency_contact_phone"></label>Emergency Contact Phone Number</label>
    <input id="i-emergency_contact_phone" type="text" name="emergency_contact_phone" required/>
    <br>

	<button type="submit">Submit</button>

</form>
